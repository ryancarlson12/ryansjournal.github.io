{% comment %}Clickable tags. Pass the tags in as "tags", e.g. tags=page.tags{% endcomment %}
{% if include.tags and include.tags.size > 0 %}
<ul class="tag-list">
  {% for tag in include.tags %}
  <li><a class="tag" href="{{ '/tags/' | relative_url }}?tag={{ tag | url_encode }}">#{{ tag | escape }}</a></li>
  {% endfor %}
</ul>
{% endif %}
